<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人 · LangGraph</title><style>body{font:16px system-ui;background:#f5f6f8;color:#14222e;max-width:960px;margin:40px auto;padding:20px}h1{font-size:26px}.badge{background:#e4efe7;padding:10px;border-radius:8px}input{width:65%;padding:12px}button{padding:10px;margin:5px;cursor:pointer;border:1px solid #bbb;border-radius:8px;background:white}article{background:white;padding:20px;margin:20px 0;border-radius:12px}pre{white-space:pre-wrap;word-break:break-all;color:#435261}small{color:#65717c}</style><h1>机器人控制台</h1><p class="badge">底轮运动已禁止 · 仅允许原地操作</p><article><input id="text" placeholder="例如：原地会议投影"><button onclick="turn()">发送</button><button onclick="voice()">录音 4 秒</button><p id="reply"></p><button onclick="demo()">原地投影测试（5 秒后收尾）</button><small>抬头、投影、关闭投影、回正；不会导航。</small></article><article><h2>任务</h2><div id="tasks"></div></article><article><h2>执行详情</h2><pre id="detail">点击任务查看执行状态与耗时事件。</pre></article><script>
const enc=encodeURIComponent;async function api(url,data){const r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function turn(){try{const r=await api('/turn',{text:document.querySelector('#text').value});document.querySelector('#reply').textContent=r.reply;refresh()}catch(e){document.querySelector('#reply').textContent=e.message}}async function voice(){document.querySelector('#reply').textContent='正在录音，请说话…';try{const r=await api('/voice-turn',{seconds:4});document.querySelector('#reply').textContent=r.recognized_text+' → '+r.reply;refresh()}catch(e){document.querySelector('#reply').textContent=e.message}}async function demo(){try{await api('/tasks',{workflow:'meeting_stationary',parameters:{hold_seconds:5}});refresh()}catch(e){document.querySelector('#reply').textContent=e.message}}async function control(id,command){try{await api('/control',{task_id:id,command});refresh()}catch(e){document.querySelector('#reply').textContent=e.message}}async function detail(id){const r=await api('/task?id='+enc(id));const e=await api('/events?task='+enc(id));document.querySelector('#detail').textContent=JSON.stringify({task:r,events:e.events},null,2)}async function refresh(){try{const r=await api('/tasks');const box=document.querySelector('#tasks');box.replaceChildren();for(const t of r.tasks){const p=document.createElement('p');const b=document.createElement('button');b.textContent=t.id.slice(0,8)+' · '+t.status;b.onclick=()=>detail(t.id);p.append(b);for(const [cmd,label]of [['pause','暂停'],['resume','继续'],['cancel','结束']]){const c=document.createElement('button');c.textContent=label;c.onclick=()=>control(t.id,cmd);p.append(c)}box.append(p)}}catch(e){document.querySelector('#reply').textContent=e.message}}refresh();setInterval(refresh,1500);
</script></html>
