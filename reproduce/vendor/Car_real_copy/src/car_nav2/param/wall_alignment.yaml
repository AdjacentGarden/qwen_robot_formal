wall_alignment:
  ros__parameters:
    # ========================================================================
    # 时间、接口与启动方式
    # ========================================================================

    # 真机必须为 false；只有使用 Gazebo /clock 时才设置为 true。
    # 本节点会用 ROS 时间检查激光消息是否过期，因此必须与雷达时间源一致。
    use_sim_time: false

    # 墙面对齐始终读取 C1 原始扫描。这样关闭 /scan_gated、暂停定位与建图后，
    # 仍可在抬头投影前执行最后一次对墙修正。
    scan_topic: /scan

    # 墙面对齐速度输出话题。
    # 强烈建议通过 twist_mux 等速度仲裁器切换到底盘；不要让本节点和 Nav2
    # 同时向底盘最终速度话题发送命令，否则两路命令会互相覆盖。
    cmd_vel_topic: /cmd_vel_wall_align

    # true：节点启动后立即开始一次墙面对齐。
    # false：等待调用 /wall_alignment/enable（SetBool）服务后再开始，推荐使用。
    start_on_launch: false

    # ========================================================================
    # 对齐目标与安全限制（角度单位均为 rad）
    # ========================================================================

    # 雷达相对车体中心线的水平安装偏角常量，逆时针为正、顺时针为负。
    # 含义：雷达 +X 轴相对 base +X 轴的偏转角。
    # 例：雷达相对车头逆时针偏了 1.5°，设置为 1.5*pi/180 = 0.02618。
    # 标定方法：人工将车体严格正对墙，观察 /wall_alignment/yaw_error，调整本值，
    # 直到多帧静止测量的 yaw_error 以 0 为中心。
    lidar_yaw_offset: 0.0

    # 单次任务由雷达实际观测到的“累计绝对修正量”上限，默认 0.6 rad（约 34.4°）。
    # 使用相邻稳定测量误差的绝对变化量累计，不使用下发的速度命令积分；因此真机
    # 差速轮打滑、静摩擦或执行不足不会提前消耗额度。正反修正都会累计，超过上限
    # 认为目标姿态或 Nav2 定位异常。车辆没有产生有效修正时由 task_timeout 兜底。
    max_total_correction: 0.6

    # 判定对齐的最大角度误差，默认 0.0872665 rad（5°）。
    # 减小：投影朝向更准确，但对雷达安装误差、墙面不平和底盘回差更敏感。
    # 建议先用 5° 验证流程，完成 lidar_yaw_offset 标定后再尝试 1°～2°。
    goal_error: 0.0872665

    # 优先修正到该目标误差（默认约 1°），而不是进入 5° 可接受范围就立即结束。
    # 若 4 秒到期时尚未达到此目标，但已处于 goal_error 内，任务仍按成功结束。
    target_error: 0.0174533

    # ========================================================================
    # 激光点选择范围
    # ========================================================================

    # 车头正前方参与拟合的总视场角，默认 2.094 rad（120°，即左右各 60°）。
    # 增大可以获得更长墙面，但更容易看到侧墙；必须小于 pi（180°）。
    front_fov: 2.0

    # 参与拟合的激光点最小距离，单位 m。
    # 用来排除车体结构、雷达近距离盲区和紧贴雷达的异常回波。
    min_range: 0.25

    # 参与拟合的激光点最大距离，单位 m。
    # 距离越远，雷达噪声通常越大；不需要看到很远的墙时不要盲目增大。
    max_range: 4.0

    # 拟合出的墙面到雷达的允许距离范围，单位 m。
    # 不在该范围内的直线即使拟合质量很好，也不会被当作目标墙面。
    min_wall_distance: 0.35
    max_wall_distance: 3.5

    # ========================================================================
    # RANSAC 墙面识别与人物/杂物过滤
    # ========================================================================

    # 墙面内点沿墙方向必须覆盖的最小宽度，单位 m。
    # 这是过滤人物、桌腿、箱子等窄物体的关键参数。
    # 调大：抗人物和杂物能力更强，但墙被严重遮挡时可能无法识别。
    # 调小：更容易找到墙，但可能把人体或家具平面误判为墙。
    min_wall_span: 0.80

    # RANSAC 随机尝试次数。次数越多，在杂物较多时越可能找到真实墙面，
    # 但 CPU 消耗也会增加。低算力平台建议先保持 100。
    ransac_iterations: 100

    # 激光点到候选直线的最大距离，小于该值才视为墙面内点，单位 m。
    # 调小：要求墙更平整、拟合更严格；调大：容忍粗糙墙面，但杂物更易混入。
    ransac_inlier_distance: 0.035

    # 一个有效墙面模型至少需要的激光内点数量。
    # 雷达角分辨率不同会显著影响点数；误报时增大，远墙经常识别失败时减小。
    min_inliers: 24

    # 墙面内点数占当前前方全部有效激光点的最低比例，取值 (0, 1]。
    # 调大可抑制杂乱环境中的误识别；人物遮挡较多时可能需要适当调小。
    min_inlier_ratio: 0.30

    # RANSAC 内点经过 PCA 精修后，点到墙面的最大允许均方根误差，单位 m。
    # 默认 2.5 cm。粗糙墙面可略微增大；若经常把杂乱物体拟合成墙则减小。
    max_fit_rms: 0.025

    # 可接受的墙面法线最大初始角度误差，默认 0.70 rad（约 40°）。
    # 超过该范围的直线可能是侧墙或错误目标，节点会拒绝使用。
    # 此值可以略大于 max_total_correction，但实际旋转仍受后者严格限制。
    max_wall_normal_error: 0.70

    # ========================================================================
    # 数据新鲜度和多帧稳定性
    # ========================================================================

    # 激光消息时间戳相对当前时间允许的最大年龄，单位 s。
    # 超过该时间的扫描会被丢弃，防止处理队列中的旧数据。
    # 此参数针对原始 /scan，而不是 Cartographer/RF2O 的整体延迟。
    # 如果雷达用一帧起始时刻作为 stamp，10 Hz 雷达可能天然接近 0.1 s。
    max_scan_age: 0.25

    # 连续运动中每批收集多少帧有效墙面角度，再取中位数更新动态控制。
    # 10 Hz 雷达设置 3 表示约每 0.3 秒更新一次速度与停止判定。
    measurement_frames: 3

    # 上述多帧角度相对中位数允许的最大离散程度，单位 rad。
    # 默认 0.035 rad（约 2°）。超过时认为人物移动、墙面识别跳变或数据不稳定，
    # 本批测量作废，继续沿用上一次可靠误差控制，等待下一批数据。
    max_measurement_spread: 0.035

    # ========================================================================
    # 连续测量与动态角速度控制参数
    # ========================================================================

    # 控制循环频率，单位 Hz。该频率只影响速度命令与状态机，不改变雷达频率。
    control_frequency: 20.0

    # 误差比例增益：speed = min_speed * rotation_kp * abs(error / goal_error)，
    # 比例小于 1 时仍保持最小速度，最终受 max_angular_speed 限制。
    rotation_kp: 1.0

    # 最小旋转角速度，单位 rad/s，默认 0.15，必须略高于底盘能够克服静摩擦的死区速度。
    # 若发出命令但小车不转，应小幅增大；过大会降低最终微调能力。
    min_angular_speed: 0.15

    # 最大旋转角速度 0.60 rad/s；大误差时按 error/goal_error 比例加速到该上限。
    max_angular_speed: 0.60

    # abs(yaw_error) 大于等于 0.30 rad 时直接使用最大速度；小于该阈值时按比例调速。
    max_speed_error_threshold: 0.30

    # 成功、取消或失败以后继续发布零速度的时间，单位 s。
    # 用来确保最后一条运动命令被明确覆盖；之后节点停止发布速度。
    zero_publish_time: 0.10

    # 单次墙面对齐目标在 4 秒内完成。到期时误差已在 goal_error 内则成功；否则失败。
    # 超时包括首次测量和连续旋转时间。
    task_timeout: 4.0
