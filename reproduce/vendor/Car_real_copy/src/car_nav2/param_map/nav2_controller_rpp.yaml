controller_server:
  ros__parameters:
    use_sim_time: true
    # Low-power real hardware: the chassis/odometry loop is about 10 Hz.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    controller_plugins: ["FollowPath"]   # ← 只用一个控制器
    
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
      
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.15
    
    # 只需要这一个控制器
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      
      desired_linear_vel: 0.3
      max_linear_accel: 0.3
      desired_rotational_vel: 0.3
      max_rotational_accel: 0.3
      lookahead_dist: 0.6
      transform_tolerance: 0.5

      # 以下是减速相关参数（与上面平级）
      approach_velocity_scaling_dist: 0.8
      min_approach_linear_velocity: 0.1

      # 以下是减速时的速度覆盖（同样平级）
      desired_linear_vel: 0.2          # 注意：这会覆盖上面的 0.6！
      desired_rotational_vel: 0.2      # 覆盖上面的 0.6
      max_linear_accel: 0.2             # 覆盖上面的 0.9
      max_rotational_accel: 0.2         # 覆盖上面的 0.8
        
      # ==========  ==========
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      # ====================================
      
      # 关键：启用原地旋转
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.56   #  大于此角度（约?度）先原地旋转
      max_angular_accel: 1.5
